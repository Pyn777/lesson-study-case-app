name: Persistence self-test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/persistence-self-test.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment
        run: sleep 45
      - name: Test Vercel to Neon persistence
        run: |
          set -e
          body="$(curl --fail --silent --show-error https://lesson-study-case-app.vercel.app/api/self-test)"
          echo "$body"
          echo "$body" | grep '"ok":true'
